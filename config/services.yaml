services:
  _defaults:
    autowire: true
    autoconfigure: true

  EvilStudio\ComposerParser\:
    resource: '../src/*'
    exclude:
      - '../src/Api/'
      - '../src/Exception/'
      - '../src/Model/'
      - '../src/Service/Provider/GitRepository.php'
      - '../src/Service/Provider/Gitlab/ApiFiles.php'
      - '../src/Service/Provider/Gitlab/ApiArchive.php'
      - '../src/Service/Provider/ProviderManager.php'
      - '../src/Service/Parser/ParserManager.php'
      - '../src/Service/Writer/WriterManager.php'
      - '../src/Service/Writer/Xlsx.php'
      - '../src/Service/Writer/Json.php'
      - '../src/Service/Writer/Html.php'
      - '../src/Service/Writer/GoogleSheets.php'

  EvilStudio\ComposerParser\Model\PackageConfig:
    arguments:
      $packageConfigData: "@=container.getParameter('package.config')"

  EvilStudio\ComposerParser\Model\StylingConfig:
    arguments:
      $stylingConfigData: "@=container.getParameter('writer.config')['styling']"

  EvilStudio\ComposerParser\Model\RepositoryList:
    arguments:
      $repositoryList: "@=container.getParameter('repository.config')['repositoryList']"

  EvilStudio\ComposerParser\Api\Data\PackageConfigInterface:
    alias: EvilStudio\ComposerParser\Model\PackageConfig

  EvilStudio\ComposerParser\Api\Data\StylingConfigInterface:
    alias: EvilStudio\ComposerParser\Model\StylingConfig

  EvilStudio\ComposerParser\Api\Data\RepositoryListInterface:
    alias: EvilStudio\ComposerParser\Model\RepositoryList

  EvilStudio\ComposerParser\Api\GoogleSheetsClientInterface:
    alias: EvilStudio\ComposerParser\Service\Writer\GoogleSheetsClient

  EvilStudio\ComposerParser\Service\Provider\GitRepository:
    arguments:
      $appDir: '%app.dir%'

  EvilStudio\ComposerParser\Service\Provider\Gitlab\ApiFiles:
    arguments:
      $appDir: '%app.dir%'
      $gitlabUrl: "@=container.getParameter('app.config')['gitlab']['url']"
      $gitlabApiToken: "@=container.getParameter('app.config')['gitlab']['apiToken']"

  EvilStudio\ComposerParser\Service\Provider\Gitlab\ApiArchive:
    arguments:
      $appDir: '%app.dir%'
      $gitlabUrl: "@=container.getParameter('app.config')['gitlab']['url']"
      $gitlabApiToken: "@=container.getParameter('app.config')['gitlab']['apiToken']"
      $ansibleVaultPassword: "@=container.getParameter('app.config')['ansibleVaultPassword'] ?? ''"

  EvilStudio\ComposerParser\Service\Provider\ProviderManager:
    arguments:
      $providerType: "@=container.getParameter('app.config')['providerType']"
      $providers:
        gitRepository: '@EvilStudio\ComposerParser\Service\Provider\GitRepository'
        gitlabApiFiles: '@EvilStudio\ComposerParser\Service\Provider\Gitlab\ApiFiles'
        gitlabApiArchive: '@EvilStudio\ComposerParser\Service\Provider\Gitlab\ApiArchive'

  EvilStudio\ComposerParser\Service\Parser\ParserManager:
    arguments:
      $parserType: "@=container.getParameter('app.config')['parserType']"
      $parsers:
        composerJson: '@EvilStudio\ComposerParser\Service\Parser\ComposerJson'
        composerJsonAndLock: '@EvilStudio\ComposerParser\Service\Parser\ComposerJsonAndLock'
        composerFull: '@EvilStudio\ComposerParser\Service\Parser\ComposerFull'

  monolog.error_handler:
    class: Monolog\Handler\StreamHandler
    arguments:
      - '%app.dir%/var/log/error.log'
      - !php/const Monolog\Level::Error

  monolog.logger:
    class: Monolog\Logger
    arguments:
      - 'composer-parser'
    calls:
      - [ pushHandler, [ '@monolog.error_handler' ] ]

  EvilStudio\ComposerParser\Service\Log\ErrorLogger:
    arguments:
      $logger: '@monolog.logger'

  EvilStudio\ComposerParser\Service\Config\ConfigValidator:
    public: true

  EvilStudio\ComposerParser\Command\Run:
    public: true

  EvilStudio\ComposerParser\Command\Cleanup:
    public: true

  EvilStudio\ComposerParser\Service\Writer\Xlsx:
    arguments:
      $fileName: "@=container.getParameter('writer.config')['local']['fileName']"
      $fileDirectory: "@=container.getParameter('writer.config')['local']['fileDirectory']"
      $sheetName: "@=container.getParameter('writer.config')['shared']['sheetName']"

  EvilStudio\ComposerParser\Service\Writer\Json:
    arguments:
      $fileName: "@=container.getParameter('writer.config')['local']['fileName']"
      $fileDirectory: "@=container.getParameter('writer.config')['local']['fileDirectory']"

  EvilStudio\ComposerParser\Service\Writer\Html:
    arguments:
      $fileName: "@=container.getParameter('writer.config')['local']['fileName']"
      $fileDirectory: "@=container.getParameter('writer.config')['local']['fileDirectory']"

  EvilStudio\ComposerParser\Service\Writer\GoogleSheets:
    arguments:
      $sheetName: "@=container.getParameter('writer.config')['shared']['sheetName']"
      $spreadsheetId: "@=container.getParameter('writer.config')['googleSheets']['spreadsheetId']"
      $serviceAccountJsonPath: "@=container.getParameter('writer.config')['googleSheets']['serviceAccountJsonPath']"

  EvilStudio\ComposerParser\Service\Writer\WriterManager:
    arguments:
      $writerType: "@=container.getParameter('app.config')['writerType']"
      $writers:
        xlsx: '@EvilStudio\ComposerParser\Service\Writer\Xlsx'
        json: '@EvilStudio\ComposerParser\Service\Writer\Json'
        html: '@EvilStudio\ComposerParser\Service\Writer\Html'
        googleSheets: '@EvilStudio\ComposerParser\Service\Writer\GoogleSheets'
